<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pemeriksaan aset logo</title>
<style>
  body{margin:0;background:#16281B;color:#F6F4EE;font-family:"Segoe UI",Arial,sans-serif;padding:28px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .cell{background:#F6F4EE;border-radius:14px;padding:20px;display:grid;gap:12px;align-content:start}
  .cell.dark{background:#193722}
  .cell b{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#526E57;font-family:Bahnschrift,"Segoe UI",sans-serif}
  .cell.dark b{color:#9FBBA6}
  .row{display:flex;align-items:center;gap:14px}
  img{display:block}
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><b>Mark 120 px</b><div class="row"><img src="../logo/azzam-mitra-mark.svg" width="120" height="120"></div></div>
  <div class="cell dark"><b>Mark terang di atas Hijau Dalam</b><div class="row"><img src="../logo/azzam-mitra-mark-light.svg" width="96" height="96"></div></div>
  <div class="cell"><b>Mark 32 px dan 16 px di atas Krem</b><div class="row"><img src="../logo/azzam-mitra-mark.svg" width="32" height="32"><img src="../logo/azzam-mitra-mark.svg" width="16" height="16"></div></div>
  <div class="cell" style="grid-column:1/3"><b>Lockup horizontal</b><div class="row"><img src="../logo/azzam-mitra-lockup-horizontal.svg" width="420"></div></div>
  <div class="cell"><b>Lockup vertikal</b><div class="row"><img src="../logo/azzam-mitra-lockup-stacked.svg" width="220"></div></div>
  <div class="cell"><b>Ikon aplikasi 512 px</b><div class="row"><img src="../logo/azzam-mitra-app-icon.svg" width="140" height="140"></div></div>
  <div class="cell"><b>Favicon 32 px</b><div class="row"><img src="../logo/azzam-mitra-favicon.svg" width="32" height="32"><img src="../logo/azzam-mitra-favicon.svg" width="64" height="64"></div></div>
  <div class="cell dark"><b>Favicon pada latar gelap</b><div class="row"><img src="../logo/azzam-mitra-favicon.svg" width="48" height="48"></div></div>
</div>
</body>
</html>
